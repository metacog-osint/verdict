name: calendar-sync
# Daily: pull Cordon's dated events (EASA bulletin expiries, State advisory and embassy-status changes) and
# Headwind's (Federal Register rule dates, FOMC and ECB decisions, FAO releases) into calendar/events.json, score
# Vis's forecasts against its METAR stores (tools/vis_record.py), link
# them to the forecasts that name them, rebuild site/, commit when anything changed, and redeploy GitHub Pages (a
# commit made here does not trigger pages.yml). Headwind failing to answer is a warning, not a failed sync, so
# Cordon's events still land. Free; no secrets.
#
# GitHub starts this account's scheduled runs hours late (this one came 18:28 to 23:08 UTC, 8-16 Nov 2026), so the hub's
# tic-dispatch Worker starts it at 13:20 UTC (hub dispatch/dispatch.js, 17 Nov 2026). The cron below is the fallback:
# the gate job skips a scheduled run when the sync job succeeded in the last 12 hours. A run whose job the gate skipped
# still ends as "success", so the gate looks for a run whose sync job itself succeeded.
on:
  schedule:
    - cron: "40 13 * * *"     # 13:40 UTC, before the 14:15 due check
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/calendar-sync.yml/runs?status=success&per_page=20" --jq '.workflow_runs[].id' || true); do
            last=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "sync" and .conclusion == "success")][0].completed_at // empty' || true)
            [ -n "$last" ] && break
          done
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 43200 ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "A sync finished at $last, under 12 hours ago: skipping this scheduled run."
          else
            echo "Last successful sync job: ${last:-none found}. Running."
          fi
  sync:
    needs: gate
    if: needs.gate.outputs.skip != 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Sync from Cordon and Headwind, and check
        run: |
          python tools/verdict.py calendar --sync cordon
          python tools/verdict.py calendar --sync headwind || echo "::warning::Headwind's events were not synced"
          python tools/direction_record.py sync || echo "::error::COP's direction log was not taken"
          python tools/vis_record.py sync || echo "::error::Vis's forecasts were not scored"
          python tools/verdict.py check
          python tools/direction_record.py check
          python tools/vis_record.py check
          python tools/build_site.py
          python tools/build_site.py --check
      - name: Commit when the calendar changed
        run: |
          if [ -n "$(git status --porcelain -- calendar site ledger/direction-log.jsonl ledger/vis-skill.jsonl)" ]; then
            git config user.name "verdict-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add calendar site ledger/direction-log.jsonl ledger/vis-skill.jsonl
            git commit -q -m "calendar: sync from Cordon and Headwind $(date -u +%Y-%m-%d)"
            git push -q origin HEAD:main
          else
            echo "calendar unchanged"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
